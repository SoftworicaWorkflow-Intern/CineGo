    <text x="200" y="470" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="44" fill="#ffffff" letter-spacing="2">HIMALAYAN</text><text x="200" y="522" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="44" fill="#ffffff" letter-spacing="2">ECHO</text>
    <text x="200" y="566" text-anchor="middle" font-size="12" fill="#ffffff" fill-opacity="0.7" letter-spacing="4">NEP · DRAMA</text>
